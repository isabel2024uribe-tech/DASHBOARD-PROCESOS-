<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de ventas</title>
  <style>
/* Tokens: paleta de referencia validada (claro y oscuro). */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --good-text: #006300;
  --warn-bg: #fff4d6;
  --warn-ink: #5a3d00;
  --warn-edge: #eda100;
  --crit-text: #b02a2a;

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --good-text: #0ca30c;
    --warn-bg: #2b2208;
    --warn-ink: #f3dca0;
    --warn-edge: #c98500;
    --crit-text: #e66767;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
}

.page { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }
.muted { color: var(--ink-2); margin: 0; font-size: 13px; }

h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 2px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }

/* Encabezado */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }

/* Controles */
.btn {
  font: inherit; font-size: 13px; font-weight: 550;
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--accent-wash); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-quiet { background: transparent; color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters {
  display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
  padding: 14px 16px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.field { display: flex; flex-direction: column; gap: 5px; margin: 0; padding: 0; border: 0; min-width: 0; }
.field > span, .field > legend { font-size: 12px; color: var(--ink-2); padding: 0; }
select, input[type="date"] {
  font: inherit; font-size: 14px; color: var(--ink);
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page);
  min-height: 36px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--ink-2);
}
.chip:hover { background: var(--accent-wash); }
.chip[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); border-color: var(--accent); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓ "; }

/* Aviso de calidad de datos */
.notice {
  background: var(--warn-bg); color: var(--warn-ink);
  border: 1px solid var(--border); border-left: 4px solid var(--warn-edge);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px;
}
.notice[hidden], .error[hidden] { display: none; }
.notice p { margin: 0 0 8px; }
.notice label { display: inline-flex; align-items: center; gap: 7px; margin-right: 18px; cursor: pointer; }
.notice details { margin-top: 8px; }
.notice summary { cursor: pointer; font-weight: 600; }
.notice ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.error {
  background: var(--surface); border: 1px solid var(--crit-text); color: var(--crit-text);
  padding: 12px 16px; border-radius: 10px; margin-bottom: 16px;
}

/* Indicadores */
.kpis { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.hero, .tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
}
.kpi-label { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); }
.hero-value { margin: 0 0 4px; font-size: clamp(40px, 6vw, 56px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; }
.tile-value { margin: 0 0 2px; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }

/* Tarjetas y gráficos */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 20px; min-width: 0;
}
.span-12 { grid-column: span 12; }
.span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; }
.span-5 { grid-column: span 5; }
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 340px; }
.empty { margin: 0; padding: 40px 0; text-align: center; color: var(--ink-2); }

/* Tablas */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); }
th button {
  font: inherit; font-weight: 600; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
}
th button:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--accent-wash); }
.share-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--series-1); vertical-align: middle; margin-right: 8px; min-width: 2px; }
.badge {
  display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 6px;
  background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-edge);
}
.card > .btn { margin-top: 12px; }

/* Responsive */
@media (max-width: 960px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .hero { grid-column: span 2; }
  .span-7, .span-6, .span-5 { grid-column: span 12; }
}
@media (max-width: 560px) {
  .page { padding: 18px 14px 48px; }
  .top { flex-direction: column; }
  .kpis { grid-template-columns: 1fr; }
  .hero { grid-column: auto; }
  .chart-box.tall { height: 300px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  </style>

<body>

    <header class="top">

    <section class="filters" aria-label="Filtros">

    <section class="grid">
      <article class="card span-12" id="cardTrend">

  <script type="module">
// Configuración del dashboard.

// CSV publicado de Google Sheets (Archivo > Compartir > Publicar en la web > CSV).
// Se usa como respaldo si el endpoint /api/data no responde.
const SHEET_CSV_URL =
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZhG16c6gNzf_76m8fnRuDOnFbYdnDDvr-9PnoEiQOVQLL30TvE44RYisrBVXTUeuZFXvD6Mtqt7ht/pub?output=csv';

// Cada cuánto se vuelve a leer la hoja mientras el panel está abierto.
const REFRESH_MS = 5 * 60 * 1000;

// Un monto es "atípico" si supera (o es menor a la fracción de) la mediana de su producto por este factor.
const OUTLIER_FACTOR = 5;

// Lógica pura (sin DOM): lectura del CSV, limpieza y agregaciones.
// Se usa tanto en el navegador como en las pruebas de Node.

/** Parser CSV mínimo con soporte de comillas, comas y saltos de línea dentro de campos. */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const src = text.replace(/^﻿/, '');

  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQuotes) {
      if (c === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && src[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some((v) => v.trim() !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some((v) => v.trim() !== '')) rows.push(row);
  return rows;
}

/** "$1,250.00" -> 1250 ; devuelve null si no es un número válido. */
function parseMoney(value) {
  if (value == null) return null;
  const cleaned = String(value).replace(/[^0-9.\-]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.') return null;
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : null;
}

/** "16/8/2026" (día/mes/año) -> Date en UTC; null si es inválida. */
function parseDate(value) {
  const m = String(value ?? '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [d, mo, y] = [Number(m[1]), Number(m[2]), Number(m[3])];
  const date = new Date(Date.UTC(y, mo - 1, d));
  const valid = date.getUTCFullYear() === y && date.getUTCMonth() === mo - 1 && date.getUTCDate() === d;
  return valid ? date : null;
}

const isoDay = (d) => d.toISOString().slice(0, 10);
const monthKey = (d) => d.toISOString().slice(0, 7);

const norm = (s) =>
  String(s ?? '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '');

function median(values) {
  const s = [...values].sort((a, b) => a - b);
  if (!s.length) return 0;
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

/**
 * Convierte el texto CSV en filas limpias.
 * Devuelve { rows, rejected, missingColumns }.
 *  - rows: registros válidos con `issues` ("atipico" y/o "futura")
 *  - rejected: filas que no se pudieron interpretar (fecha o monto inválidos)
 */
function buildDataset(csvText, { today = new Date(), outlierFactor = 5 } = {}) {
  const table = parseCSV(csvText);
  if (!table.length) return { rows: [], rejected: [], missingColumns: ['fecha', 'vendedor', 'producto', 'monto', 'region'] };

  const header = table[0].map(norm);
  const idx = {
    date: header.indexOf('fecha'),
    seller: header.indexOf('vendedor'),
    product: header.indexOf('producto'),
    amount: header.indexOf('monto'),
    region: header.indexOf('region'),
  };
  const missingColumns = Object.entries(idx).filter(([, i]) => i < 0).map(([k]) => k);
  if (missingColumns.length) return { rows: [], rejected: [], missingColumns };

  const rows = [];
  const rejected = [];
  table.slice(1).forEach((cells, i) => {
    const line = i + 2; // número de fila en la hoja (1 = encabezado)
    const date = parseDate(cells[idx.date]);
    const amount = parseMoney(cells[idx.amount]);
    const seller = (cells[idx.seller] ?? '').trim();
    const product = (cells[idx.product] ?? '').trim();
    const region = (cells[idx.region] ?? '').trim();
    if (!date || amount == null || !product || !region) {
      rejected.push({ line, raw: cells.join(' | ') });
      return;
    }
    rows.push({ line, date, day: isoDay(date), month: monthKey(date), seller: seller || 'Sin asignar', product, region, amount, issues: [] });
  });

  // Atípicos: montos muy lejos de la mediana de su producto.
  const byProduct = new Map();
  rows.forEach((r) => {
    if (!byProduct.has(r.product)) byProduct.set(r.product, []);
    byProduct.get(r.product).push(r.amount);
  });
  const medians = new Map([...byProduct].map(([p, v]) => [p, median(v)]));
  const todayDay = isoDay(today);
  rows.forEach((r) => {
    const med = medians.get(r.product);
    if (med > 0 && (r.amount > med * outlierFactor || r.amount < med / outlierFactor)) r.issues.push('atipico');
    if (r.day > todayDay) r.issues.push('futura');
  });

  return { rows, rejected, missingColumns: [] };
}

/** Aplica filtros y opciones de calidad de datos. */
function applyFilters(rows, f) {
  return rows.filter((r) => {
    if (f.excludeOutliers && r.issues.includes('atipico')) return false;
    if (f.excludeFuture && r.issues.includes('futura')) return false;
    if (f.from && r.day < f.from) return false;
    if (f.to && r.day > f.to) return false;
    if (f.regions && f.regions.size && !f.regions.has(r.region)) return false;
    if (f.products && f.products.size && !f.products.has(r.product)) return false;
    if (f.seller && r.seller !== f.seller) return false;
    return true;
  });
}

function sum(rows) {
  return rows.reduce((a, r) => a + r.amount, 0);
}

function groupSum(rows, key) {
  const m = new Map();
  rows.forEach((r) => {
    const k = typeof key === 'function' ? key(r) : r[key];
    const cur = m.get(k) ?? { key: k, total: 0, count: 0 };
    cur.total += r.amount;
    cur.count += 1;
    m.set(k, cur);
  });
  return [...m.values()].sort((a, b) => b.total - a.total);
}

/** Meses consecutivos (YYYY-MM) entre el primero y el último, sin huecos. */
function monthRange(rows) {
  if (!rows.length) return [];
  const keys = rows.map((r) => r.month).sort();
  const [y0, m0] = keys[0].split('-').map(Number);
  const [y1, m1] = keys[keys.length - 1].split('-').map(Number);
  const out = [];
  let y = y0, m = m0;
  while (y < y1 || (y === y1 && m <= m1)) {
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return out;
}



/* ---------- Utilidades ---------- */
const $ = (id) => document.getElementById(id);

const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach((c) => {
    if (c == null || c === false) return;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return el;
};

const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const moneyFull = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const moneyCompact = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 });
const int = new Intl.NumberFormat('en-US');

const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const monthLabel = (key) => `${MONTHS[Number(key.slice(5, 7)) - 1]} ${key.slice(2, 4)}`;
const dayLabel = (iso) => `${Number(iso.slice(8, 10))} ${MONTHS[Number(iso.slice(5, 7)) - 1]} ${iso.slice(0, 4)}`;

const pad = (n) => String(n).padStart(2, '0');
const isoOf = (y, m, d) => new Date(Date.UTC(y, m, d)).toISOString().slice(0, 10);

// "Hoy" según el calendario local del usuario (no UTC), para no adelantar el día por la noche.
function localToday() {
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- Estado ---------- */
const state = {
  dataset: { rows: [], rejected: [], missingColumns: [] },
  today: localToday(),
  filters: {
    period: 'all', from: '', to: '',
    regions: new Set(), products: new Set(), seller: '',
    excludeOutliers: true, excludeFuture: true,
  },
  sort: { key: 'day', dir: 'desc' },
  shown: 25,
  productSlots: new Map(), // producto -> posición fija de color (no cambia al filtrar)
};
const charts = {};

/* ---------- Carga de datos ---------- */
async function fetchCSV() {
  const sources = ['/api/data', SHEET_CSV_URL];
  let lastError;
  for (const url of sources) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (!text.includes(',')) throw new Error('Respuesta vacía o inesperada');
      return text;
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError;
}

async function load({ manual = false } = {}) {
  const btn = $('refresh');
  btn.disabled = true;
  try {
    const csv = await fetchCSV();
    state.today = localToday();
    const dataset = buildDataset(csv, { today: state.today, outlierFactor: OUTLIER_FACTOR });
    if (dataset.missingColumns.length) {
      throw new Error(`Faltan columnas en la hoja: ${dataset.missingColumns.join(', ')}. Se esperan Fecha, Vendedor, Producto, Monto y Región.`);
    }
    state.dataset = dataset;
    state.productSlots = new Map([...new Set(dataset.rows.map((r) => r.product))].sort((a, b) => a.localeCompare(b, 'es')).map((p, i) => [p, i]));
    $('error').hidden = true;
    buildFilterControls();
    $('updated').textContent = `Actualizado a las ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
    render();
  } catch (err) {
    const msg = `No se pudieron cargar los datos. ${err.message || err}. ${state.dataset.rows.length ? 'Se muestran los últimos datos cargados.' : 'Revisa que la hoja siga publicada en la web como CSV.'}`;
    $('error').textContent = msg;
    $('error').hidden = false;
    $('updated').textContent = manual ? 'No se pudo actualizar' : 'Sin conexión con la hoja';
  } finally {
    btn.disabled = false;
  }
}

/* ---------- Filtros ---------- */
function buildFilterControls() {
  const rows = state.dataset.rows;
  const regions = [...new Set(rows.map((r) => r.region))].sort((a, b) => a.localeCompare(b, 'es'));
  const products = [...state.productSlots.keys()];
  const sellers = [...new Set(rows.map((r) => r.seller))].sort((a, b) => a.localeCompare(b, 'es'));

  // Mantener solo selecciones que siguen existiendo tras una actualización.
  state.filters.regions = new Set([...state.filters.regions].filter((x) => regions.includes(x)));
  state.filters.products = new Set([...state.filters.products].filter((x) => products.includes(x)));
  if (!sellers.includes(state.filters.seller)) state.filters.seller = '';

  const chips = (container, values, set) => {
    container.replaceChildren(
      ...values.map((v) =>
        h('button', {
          type: 'button', class: 'chip', 'aria-pressed': String(set.has(v)),
          onclick: (e) => {
            set.has(v) ? set.delete(v) : set.add(v);
            e.currentTarget.setAttribute('aria-pressed', String(set.has(v)));
            state.shown = 25;
            render();
          },
        }, v)
      )
    );
  };
  chips($('regionChips'), regions, state.filters.regions);
  chips($('productChips'), products, state.filters.products);

  $('seller').replaceChildren(h('option', { value: '' }, 'Todos'), ...sellers.map((s) => h('option', { value: s }, s)));
  $('seller').value = state.filters.seller;
}

function resolvePeriod() {
  const f = state.filters;
  const t = state.today;
  const [y, m, d] = [t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()];
  switch (f.period) {
    case 'month': return { from: isoOf(y, m, 1), to: isoOf(y, m + 1, 0) };
    case 'd30': return { from: isoOf(y, m, d - 29), to: isoOf(y, m, d) };
    case 'd90': return { from: isoOf(y, m, d - 89), to: isoOf(y, m, d) };
    case 'year': return { from: isoOf(y, 0, 1), to: isoOf(y, 11, 31) };
    case 'custom': return { from: f.from, to: f.to };
    default: return { from: '', to: '' };
  }
}

function currentRows() {
  const { from, to } = resolvePeriod();
  return applyFilters(state.dataset.rows, { ...state.filters, from, to });
}

function bindControls() {
  $('period').addEventListener('change', (e) => {
    state.filters.period = e.target.value;
    const custom = e.target.value === 'custom';
    $('fromWrap').hidden = !custom;
    $('toWrap').hidden = !custom;
    state.shown = 25;
    render();
  });
  $('from').addEventListener('change', (e) => { state.filters.from = e.target.value; render(); });
  $('to').addEventListener('change', (e) => { state.filters.to = e.target.value; render(); });
  $('seller').addEventListener('change', (e) => { state.filters.seller = e.target.value; state.shown = 25; render(); });
  $('reset').addEventListener('click', () => {
    Object.assign(state.filters, { period: 'all', from: '', to: '', seller: '' });
    state.filters.regions.clear();
    state.filters.products.clear();
    $('period').value = 'all';
    $('from').value = '';
    $('to').value = '';
    $('fromWrap').hidden = true;
    $('toWrap').hidden = true;
    state.shown = 25;
    buildFilterControls();
    render();
  });
  $('refresh').addEventListener('click', () => load({ manual: true }));
  $('more').addEventListener('click', () => { state.shown += 25; renderDetail(currentRows()); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
}

/* ---------- Render ---------- */
function render() {
  const rows = currentRows();
  renderQuality();
  renderKpis(rows);
  const empty = rows.length === 0;
  ['cardTrend', 'cardProduct', 'cardRegion', 'cardSellers', 'cardDetail'].forEach((id) => {
    const card = $(id);
    card.querySelector('.empty')?.remove();
    const body = card.querySelector('.chart-box, .table-wrap');
    body.hidden = empty;
    if (empty) card.append(h('p', { class: 'empty' }, 'No hay ventas con estos filtros. Cambia el período o limpia los filtros.'));
  });
  if (empty) {
    Object.values(charts).forEach((c) => c.destroy());
    Object.keys(charts).forEach((k) => delete charts[k]);
    $('more').hidden = true;
    return;
  }
  renderTrend(rows);
  renderBars('productChart', groupSum(rows, 'product'), (k) => css(`--series-${(state.productSlots.get(k) ?? 0) % 8 + 1}`));
  renderBars('regionChart', groupSum(rows, 'region'), () => css('--series-1'));
  renderSellers(rows);
  renderDetail(rows);
}

function renderQuality() {
  const box = $('dq');
  const { rows, rejected } = state.dataset;
  const outliers = rows.filter((r) => r.issues.includes('atipico'));
  const future = rows.filter((r) => r.issues.includes('futura'));
  if (!outliers.length && !future.length && !rejected.length) { box.hidden = true; return; }

  const f = state.filters;
  const list = (items, label) =>
    items.length
      ? h('details', {},
          h('summary', {}, `Ver ${label} (${items.length})`),
          h('ul', {}, items.map((r) => h('li', {}, `Fila ${r.line} de la hoja: ${dayLabel(r.day)} · ${r.seller} · ${r.product} · ${moneyFull.format(r.amount)} · ${r.region}`))))
      : null;

  const parts = [h('p', {}, h('strong', {}, 'Revisa la hoja de ventas. '), 'Hay registros que pueden distorsionar los totales; elige si se incluyen.')];
  const toggles = [];
  if (outliers.length) {
    toggles.push(h('label', {}, h('input', { type: 'checkbox', checked: f.excludeOutliers, onchange: (e) => { f.excludeOutliers = e.target.checked; render(); } }), `Excluir montos atípicos (${outliers.length})`));
  }
  if (future.length) {
    toggles.push(h('label', {}, h('input', { type: 'checkbox', checked: f.excludeFuture, onchange: (e) => { f.excludeFuture = e.target.checked; render(); } }), `Excluir fechas futuras (${future.length})`));
  }
  if (toggles.length) parts.push(h('p', {}, toggles));
  parts.push(list(outliers, 'montos atípicos'), list(future, 'ventas con fecha futura'));
  if (rejected.length) {
    parts.push(h('details', {},
      h('summary', {}, `${rejected.length} fila(s) ilegibles ignoradas`),
      h('ul', {}, rejected.map((r) => h('li', {}, `Fila ${r.line}: ${r.raw}`)))));
  }
  box.replaceChildren(...parts.filter(Boolean));
  box.hidden = false;
}

function renderKpis(rows) {
  const total = sum(rows);
  $('kTotal').textContent = money.format(total);
  $('kCount').textContent = int.format(rows.length);
  $('kAvg').textContent = rows.length ? money.format(total / rows.length) : '–';
  if (rows.length) {
    const days = rows.map((r) => r.day).sort();
    $('kRange').textContent = `${dayLabel(days[0])} al ${dayLabel(days[days.length - 1])}`;
    const top = groupSum(rows, 'region')[0];
    $('kRegion').textContent = top.key;
    $('kRegionShare').textContent = `${Math.round((top.total / total) * 100)}% de las ventas`;
  } else {
    $('kRange').textContent = 'Sin datos para este filtro';
    $('kRegion').textContent = '–';
    $('kRegionShare').textContent = '';
  }
}

function baseChartOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    font: { family: css('--font') || 'system-ui' },
  };
}

function renderTrend(rows) {
  const months = monthRange(rows);
  const products = [...state.productSlots.keys()].filter((p) => rows.some((r) => r.product === p));
  const datasets = products.map((p) => ({
    label: p,
    data: months.map((m) => rows.filter((r) => r.month === m && r.product === p).reduce((a, r) => a + r.amount, 0)),
    backgroundColor: css(`--series-${(state.productSlots.get(p) % 8) + 1}`),
    borderColor: css('--surface'),
    borderWidth: 2,
    maxBarThickness: 24,
  }));
  const ink2 = css('--ink-2');
  const ink3 = css('--ink-3');

  charts.trend?.destroy();
  charts.trend = new Chart($('trendChart'), {
    type: 'bar',
    data: { labels: months.map(monthLabel), datasets },
    options: {
      ...baseChartOptions(),
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false }, border: { color: css('--axis') }, ticks: { color: ink3 } },
        y: {
          stacked: true, beginAtZero: true,
          grid: { color: css('--grid') }, border: { display: false },
          ticks: { color: ink3, callback: (v) => moneyCompact.format(v), maxTicksLimit: 6 },
        },
      },
      plugins: {
        legend: { position: 'top', align: 'start', labels: { color: ink2, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },
        tooltip: {
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          filter: (item) => item.parsed.y > 0,
          callbacks: {
            label: (c) => ` ${c.dataset.label}: ${moneyFull.format(c.parsed.y)}`,
            footer: (items) => `Total: ${moneyFull.format(items.reduce((a, i) => a + i.parsed.y, 0))}`,
          },
        },
      },
    },
  });
}

const valueLabels = {
  id: 'valueLabels',
  afterDatasetsDraw(chart, _args, opts) {
    const { ctx } = chart;
    ctx.save();
    ctx.font = `600 12px ${opts.font}`;
    ctx.fillStyle = opts.color;
    ctx.textBaseline = 'middle';
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      ctx.fillText(moneyCompact.format(chart.data.datasets[0].data[i]), bar.x + 8, bar.y);
    });
    ctx.restore();
  },
};

function renderBars(canvasId, groups, colorOf) {
  const key = canvasId;
  charts[key]?.destroy();
  charts[key] = new Chart($(canvasId), {
    type: 'bar',
    data: {
      labels: groups.map((g) => g.key),
      datasets: [{
        data: groups.map((g) => g.total),
        backgroundColor: groups.map((g) => colorOf(g.key)),
        maxBarThickness: 24,
        borderRadius: { topRight: 4, bottomRight: 4 },
        borderSkipped: 'start',
      }],
    },
    options: {
      ...baseChartOptions(),
      indexAxis: 'y',
      layout: { padding: { right: 56 } },
      scales: {
        x: { beginAtZero: true, grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--ink-3'), callback: (v) => moneyCompact.format(v), maxTicksLimit: 5 } },
        y: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: css('--ink-2') } },
      },
      plugins: {
        legend: { display: false },
        valueLabels: { color: css('--ink-2'), font: css('--font') || 'system-ui' },
        tooltip: {
          callbacks: {
            label: (c) => {
              const g = groups[c.dataIndex];
              return ` ${moneyFull.format(g.total)} · ${int.format(g.count)} ventas`;
            },
          },
        },
      },
    },
    plugins: [valueLabels],
  });
}

function renderSellers(rows) {
  const top = groupSum(rows, 'seller').slice(0, 10);
  const max = top[0]?.total || 1;
  $('sellersTable').replaceChildren(
    h('thead', {}, h('tr', {}, h('th', {}, 'Vendedor'), h('th', {}, 'Ventas'), h('th', { class: 'num' }, 'Total'))),
    h('tbody', {}, top.map((s) =>
      h('tr', {},
        h('td', {}, s.key),
        h('td', {}, h('span', { class: 'share-bar', style: `width:${Math.max(2, Math.round((s.total / max) * 80))}px` }), int.format(s.count)),
        h('td', { class: 'num' }, moneyFull.format(s.total))
      )
    ))
  );
}

const COLUMNS = [
  { key: 'day', label: 'Fecha' },
  { key: 'seller', label: 'Vendedor' },
  { key: 'product', label: 'Producto' },
  { key: 'region', label: 'Región' },
  { key: 'amount', label: 'Monto', num: true },
];

function renderDetail(rows) {
  const { key, dir } = state.sort;
  const sorted = [...rows].sort((a, b) => {
    const r = typeof a[key] === 'number' ? a[key] - b[key] : String(a[key]).localeCompare(String(b[key]), 'es');
    return dir === 'asc' ? r : -r;
  });
  const visible = sorted.slice(0, state.shown);

  const head = h('tr', {}, COLUMNS.map((c) => {
    const active = state.sort.key === c.key;
    return h('th', { class: c.num ? 'num' : '', 'aria-sort': active ? (dir === 'asc' ? 'ascending' : 'descending') : 'none' },
      h('button', {
        type: 'button',
        onclick: () => {
          state.sort = { key: c.key, dir: active && dir === 'desc' ? 'asc' : 'desc' };
          renderDetail(rows);
        },
      }, c.label + (active ? (dir === 'asc' ? ' ▲' : ' ▼') : '')));
  }));

  $('detailTable').replaceChildren(
    h('thead', {}, head),
    h('tbody', {}, visible.map((r) =>
      h('tr', {},
        h('td', {}, dayLabel(r.day)),
        h('td', {}, r.seller),
        h('td', {}, r.product),
        h('td', {}, r.region),
        h('td', { class: 'num' },
          moneyFull.format(r.amount),
          r.issues.includes('atipico') ? h('span', { class: 'badge' }, '⚠ Atípico') : null,
          r.issues.includes('futura') ? h('span', { class: 'badge' }, '⚠ Fecha futura') : null)
      )
    ))
  );
  const more = $('more');
  more.hidden = sorted.length <= state.shown;
  more.textContent = `Mostrar más (${sorted.length - state.shown} restantes)`;
}

/* ---------- Inicio ---------- */
bindControls();
load();
setInterval(() => load(), REFRESH_MS);

  </script>
</body>
</html>
